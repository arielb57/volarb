name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared minimum (requires-python >= 3.10).
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: volarb generate --seed 1 --inject bump > grid.csv
      - name: check exits 1 on an arbitrage grid
        run: |
          set +e
          volarb check grid.csv
          test $? -eq 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
      - run: python -m pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python bench/bench_min_removal.py --quick
      - run: python bench/svi_gj_table.py
